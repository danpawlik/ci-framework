- name: Ensure openshift-install is available on the install host
  ansible.builtin.include_tasks: ensure_openshift_install.yml

- name: Wait for bootstrap complete
  when:
    - not (cifmw_sno_dry_run | bool)
    - cifmw_sno_wait_bootstrap_complete | bool
  ansible.builtin.command:
    chdir: "{{ cifmw_sno_workdir }}"
    cmd: >-
      {{ _cifmw_sno_openshift_install_cmd }} wait-for bootstrap-complete
      --dir {{ cifmw_sno_workdir }}
      --log-level {{ cifmw_sno_log_level }}
  environment: "{{ _cifmw_sno_install_env }}"
  async: "{{ cifmw_sno_install_timeout_sec }}"
  poll: 30

- name: Wait for install complete
  when: not (cifmw_sno_dry_run | bool)
  ansible.builtin.command:
    chdir: "{{ cifmw_sno_workdir }}"
    cmd: >-
      {{ _cifmw_sno_openshift_install_cmd }} wait-for install-complete
      --dir {{ cifmw_sno_workdir }}
      --log-level {{ cifmw_sno_log_level }}
  environment: "{{ _cifmw_sno_install_env }}"
  async: "{{ cifmw_sno_install_timeout_sec }}"
  poll: 30
