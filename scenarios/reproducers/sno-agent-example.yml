---
# Example extra-vars for playbooks/deploy-sno-agent.yml (adjust all values).
#
# ansible-playbook -i '192.168.120.10,' playbooks/deploy-sno-agent.yml \
#   -e @scenarios/reproducers/sno-agent-example.yml \
#   -e ansible_user=zuul

cifmw_sno_pull_secret_src: /home/dpawlik/RH/my-playbooks/playbooks/group_vars/pull-secret.txt

cifmw_sno_cluster_name: sno
cifmw_sno_base_domain: lab.local
cifmw_sno_rendezvous_ip: 192.168.120.10

cifmw_sno_machine_network_cidr: "192.168.120.0/24"

cifmw_sno_hosts:
  - hostname: sno-0
    interface_name: enp1s0
    mac_address: "52:54:00:00:00:10"
    role: master
    root_device_hint_device: /dev/vda
    # Optional static NMState (omit if DHCP is enough for discovery + install):
    # network_config:
    #   dns-resolver:
    #     config:
    #       server:
    #         - 192.168.120.1
    #   interfaces:
    #     - name: enp1s0
    #       type: ethernet
    #       state: up
    #       ipv4:
    #         enabled: true
    #         dhcp: false
    #         address:
    #           - ip: 192.168.120.10
    #             prefix-length: 24
    #   routes:
    #     config:
    #       - destination: 0.0.0.0/0
    #         next-hop-address: 192.168.120.1
    #         next-hop-interface: enp1s0

# Optional SNO capability trimming (string "None" is intentional):
# cifmw_sno_capabilities_baseline: "None"
# cifmw_sno_capabilities_additional:
#   - openshift-samples

# openshift-install is fetched here if missing (needs HTTPS to mirror.openshift.com):
cifmw_sno_openshift_install_download: true
cifmw_sno_openshift_client_version: stable-4.18

cifmw_sno_build_iso: true
cifmw_sno_wait_install_complete: false
